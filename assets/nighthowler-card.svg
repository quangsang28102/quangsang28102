<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="NightHowler 3D Werewolf Arena Three.js WebSockets WebRTC">
  <defs>
    <linearGradient id="bg-wolf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a0a14"/>
      <stop offset="0.5" stop-color="#121124"/>
      <stop offset="1" stop-color="#1e1233"/>
    </linearGradient>
    <linearGradient id="moon-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accent-wolf" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-wolf)" rx="22"/>
  <circle cx="400" cy="150" r="140" fill="url(#halo)"/>

  <!-- Low Poly Moon -->
  <g transform="translate(340, 45)">
    <polygon points="60,0 105,25 120,70 95,115 50,120 15,90 5,45 25,10" fill="url(#moon-glow)" opacity=".9"/>
    <polygon points="60,0 75,35 105,25" fill="#fef9c3" opacity=".6"/>
    <polygon points="75,35 95,75 120,70" fill="#fde047" opacity=".5"/>
    <polygon points="75,35 50,70 95,75" fill="#facc15" opacity=".7"/>
  </g>

  <!-- 3D Low-Poly Wolf Silhouette -->
  <g transform="translate(325, 90)" fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- Wolf Face Wireframe -->
    <polygon points="75,20 30,70 120,70" stroke="#c084fc" fill="#1e1635" fill-opacity=".85"/>
    <!-- Left ear -->
    <polygon points="35,68 15,10 55,40" stroke="#e879f9" fill="#2d1b4e" fill-opacity=".7"/>
    <!-- Right ear -->
    <polygon points="115,68 135,10 95,40" stroke="#e879f9" fill="#2d1b4e" fill-opacity=".7"/>
    <!-- Snout & Nose -->
    <polygon points="30,70 75,130 120,70" stroke="#a855f7" fill="#281745" fill-opacity=".9"/>
    <polygon points="55,70 75,130 95,70" stroke="#f472b6" fill="#3b1d5c" fill-opacity=".95"/>
    <polygon points="65,115 75,130 85,115" stroke="#f43f5e" fill="#f43f5e"/>
    <!-- Eyes -->
    <polygon points="45,62 55,68 40,72" stroke="#22d3ee" fill="#22d3ee"/>
    <polygon points="105,62 95,68 110,72" stroke="#22d3ee" fill="#22d3ee"/>
  </g>

  <!-- Realtime audio / wave badges -->
  <g transform="translate(310, 240)">
    <rect width="180" height="28" rx="14" fill="#20183b" stroke="url(#accent-wolf)" stroke-width="1.5"/>
    <circle cx="20" cy="14" r="5" fill="#22c55e"/>
    <text x="32" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Spatial Audio Active</text>
  </g>

  <text x="400" y="335" fill="#f8fafc" font-size="38" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">NIGHTHOWLER 3D</text>
  <text x="400" y="377" fill="#cbd5e1" font-size="22" font-family="Arial, sans-serif" text-anchor="middle">Three.js WebGL  ·  Colyseus WebSockets  ·  LiveKit Audio</text>
</svg>